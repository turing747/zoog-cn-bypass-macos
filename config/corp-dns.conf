# Corporate split-horizon DNS for ZoogCNBypass.
#
# Format: <domain> <dns-server-ipv4>
#
# Each domain (and all of its subdomains) is resolved by the given DNS server
# through a macOS supplemental resolver, bypassing the local dnsmasq. The
# resolver is published only while the DNS server is reachable through a
# dedicated route that is not the default (ZoogVPN/physical) path, e.g. while
# a corporate VPN such as UniVPN is connected; otherwise it is removed so the
# public records of these domains keep working.
#
# Re-run ./install.sh after editing this file.
xytdt.com 10.23.101.11
gzxh.net 10.23.101.11
