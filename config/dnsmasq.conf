# Local split-DNS resolver for ZoogCNBypass.
# Domestic domains use AliDNS directly. Other domains use upstream resolvers
# managed dynamically in upstream-servers.conf (ZoogVPN: 1.1.1.1/8.8.8.8;
# Clash Pro TUN: 198.18.0.2).
port=53
user=nobody
group=nobody
interface=lo0
listen-address=127.0.0.1,::1
bind-interfaces
no-hosts
no-resolv
no-poll
clear-on-reload
domain-needed
bogus-priv
stop-dns-rebind
dns-forward-max=300
servers-file=/Library/Application Support/ZoogCNBypass/upstream-servers.conf
cache-size=10000
neg-ttl=60
conf-file=/Library/Application Support/ZoogCNBypass/accelerated-domains.china.conf
conf-file=/Library/Application Support/ZoogCNBypass/apple.china.conf
