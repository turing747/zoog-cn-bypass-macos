# Local split-DNS resolver for ZoogCNBypass.
# Domestic domains use AliDNS directly. Other domains use resolvers whose IP
# routes remain inside ZoogVPN.
port=53
listen-address=127.0.0.1,::1
bind-interfaces
no-resolv
no-poll
server=1.1.1.1
server=8.8.8.8
cache-size=10000
neg-ttl=60
conf-file=/Library/Application Support/ZoogCNBypass/accelerated-domains.china.conf
conf-file=/Library/Application Support/ZoogCNBypass/apple.china.conf
